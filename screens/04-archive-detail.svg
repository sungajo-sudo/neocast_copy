<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="50%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#00000012"/></filter>
    <filter id="shadowCard"><feDropShadow dx="0" dy="5" stdDeviation="14" flood-color="#00000014"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="1020" fill="url(#bg)"/>
  <circle cx="200" cy="300" r="320" fill="#93c5fd" opacity="0.15" filter="url(#blur1)"/>
  <circle cx="1300" cy="700" r="280" fill="#c4b5fd" opacity="0.13" filter="url(#blur1)"/>
  <rect width="1440" height="1020" fill="white" opacity="0.40"/>

  <!-- Header -->
  <rect x="0" y="0" width="1440" height="56" fill="white" fill-opacity="0.72" stroke="white" stroke-opacity="0.5" stroke-width="1"/>
  <text x="28" y="34" font-size="13" fill="#6b7280" cursor="pointer">← 뒤로</text>
  <text x="82" y="35" font-size="16" font-weight="700" fill="#1f2937">중학교 수학 - 이차방정식</text>
  <text x="360" y="35" font-size="13" fill="#9ca3af">2026.03.10 · 12명</text>

  <!-- Content area: max-w-5xl centered (960px) starting at x=240 -->

  <!-- 1. PDF 정보 영역 -->
  <rect x="240" y="76" width="960" height="44" rx="14" fill="white" fill-opacity="0.72" stroke="white" stroke-opacity="0.6" stroke-width="1" filter="url(#shadow)"/>
  <!-- File info inline -->
  <text x="260" y="103" font-size="13" font-weight="500" fill="#1f2937">중학교_수학_이차방정식_워크시트.pdf</text>
  <text x="560" y="103" font-size="13" fill="#d1d5db">·</text>
  <text x="572" y="103" font-size="13" fill="#6b7280">3P</text>
  <text x="596" y="103" font-size="13" fill="#d1d5db">·</text>
  <text x="608" y="103" font-size="13" fill="#6b7280">2026/03/10</text>
  <text x="692" y="103" font-size="13" fill="#d1d5db">·</text>
  <text x="704" y="103" font-size="12" font-family="monospace" fill="#9ca3af">SOBP: 5.255.0.250</text>
  <!-- Buttons -->
  <rect x="1050" y="84" width="64" height="28" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="1082" y="102" text-anchor="middle" font-size="12" fill="#374151">👁 보기</text>
  <rect x="1124" y="84" width="64" height="28" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="1156" y="102" text-anchor="middle" font-size="12" fill="#374151">🖨 인쇄</text>

  <!-- 2. 내 필기 섹션 -->
  <text x="240" y="152" font-size="13" font-weight="600" fill="#6b7280">내 필기</text>

  <!-- My card (w-48 = 192px) -->
  <rect x="240" y="164" width="168" height="268" rx="16" fill="white" fill-opacity="0.85" stroke="white" stroke-opacity="0.65" stroke-width="1.5" filter="url(#shadowCard)"/>
  <!-- stroke preview -->
  <rect x="240" y="164" width="168" height="222" rx="16" fill="#f8f9fa"/>
  <line x1="268" y1="210" x2="380" y2="260" stroke="#4F86F7" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="275" y1="300" x2="378" y2="340" stroke="#4F86F7" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="230" x2="340" y2="370" stroke="#4F86F7" stroke-width="2" stroke-linecap="round"/>
  <!-- name row -->
  <text x="254" y="402" font-size="13" font-weight="500" fill="#1f2937">김선생</text>
  <rect x="360" y="387" width="38" height="18" rx="9" fill="#dbeafe"/>
  <text x="379" y="400" text-anchor="middle" font-size="10" fill="#1d4ed8">호스트</text>

  <!-- 3. 참가자 필기 섹션 -->
  <text x="240" y="464" font-size="13" font-weight="600" fill="#6b7280">참가자 필기</text>

  <!-- 3-col grid: card w=292, gap=16, start x=240 -->
  <!-- Card 1: 박민준 -->
  <rect x="240" y="476" width="292" height="400" rx="16" fill="white" fill-opacity="0.85" stroke="white" stroke-opacity="0.65" stroke-width="1.5" filter="url(#shadowCard)"/>
  <rect x="240" y="476" width="292" height="358" rx="16" fill="#f8f9fa"/>
  <line x1="268" y1="540" x2="500" y2="610" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="660" x2="490" y2="720" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
  <line x1="310" y1="580" x2="390" y2="810" stroke="#FF6B6B" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="852" font-size="13" font-weight="500" fill="#1f2937">박민준</text>
  <rect x="472" y="838" width="44" height="18" rx="9" fill="#f3f4f6"/>
  <text x="494" y="851" text-anchor="middle" font-size="10" fill="#6b7280">게스트</text>

  <!-- Card 2: 이서연 -->
  <rect x="548" y="476" width="292" height="400" rx="16" fill="white" fill-opacity="0.85" stroke="white" stroke-opacity="0.65" stroke-width="1.5" filter="url(#shadowCard)"/>
  <rect x="548" y="476" width="292" height="358" rx="16" fill="#f8f9fa"/>
  <line x1="576" y1="550" x2="800" y2="620" stroke="#51CF66" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="588" y1="670" x2="790" y2="730" stroke="#51CF66" stroke-width="2" stroke-linecap="round"/>
  <line x1="618" y1="590" x2="698" y2="820" stroke="#51CF66" stroke-width="2" stroke-linecap="round"/>
  <text x="564" y="852" font-size="13" font-weight="500" fill="#1f2937">이서연</text>
  <rect x="780" y="838" width="44" height="18" rx="9" fill="#f3f4f6"/>
  <text x="802" y="851" text-anchor="middle" font-size="10" fill="#6b7280">게스트</text>

  <!-- Card 3: 최도윤 -->
  <rect x="856" y="476" width="292" height="400" rx="16" fill="white" fill-opacity="0.85" stroke="white" stroke-opacity="0.65" stroke-width="1.5" filter="url(#shadowCard)"/>
  <rect x="856" y="476" width="292" height="358" rx="16" fill="#f8f9fa"/>
  <line x1="884" y1="530" x2="1100" y2="600" stroke="#FF9F43" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="896" y1="660" x2="1098" y2="730" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
  <line x1="926" y1="570" x2="1006" y2="820" stroke="#FF9F43" stroke-width="2" stroke-linecap="round"/>
  <text x="872" y="852" font-size="13" font-weight="500" fill="#1f2937">최도윤</text>
  <rect x="1088" y="838" width="44" height="18" rx="9" fill="#f3f4f6"/>
  <text x="1110" y="851" text-anchor="middle" font-size="10" fill="#6b7280">게스트</text>

  <!-- 나머지 참가자 (정하은, 강지우) 두 카드 — 하단 잘림 처리 -->
  <rect x="240" y="892" width="292" height="120" rx="16" fill="white" fill-opacity="0.7" stroke="white" stroke-opacity="0.5" stroke-width="1.5" filter="url(#shadowCard)"/>
  <rect x="240" y="892" width="292" height="90" rx="16" fill="#f8f9fa"/>
  <line x1="268" y1="920" x2="480" y2="960" stroke="#A29BFE" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="990" font-size="13" font-weight="500" fill="#1f2937">정하은</text>
  <rect x="472" y="976" width="44" height="18" rx="9" fill="#f3f4f6"/>
  <text x="494" y="989" text-anchor="middle" font-size="10" fill="#6b7280">게스트</text>

  <rect x="548" y="892" width="292" height="120" rx="16" fill="white" fill-opacity="0.7" stroke="white" stroke-opacity="0.5" stroke-width="1.5" filter="url(#shadowCard)"/>
  <rect x="548" y="892" width="292" height="90" rx="16" fill="#f8f9fa"/>
  <line x1="576" y1="930" x2="790" y2="960" stroke="#4F86F7" stroke-width="2" stroke-linecap="round"/>
  <text x="564" y="990" font-size="13" font-weight="500" fill="#1f2937">강지우</text>
  <rect x="780" y="976" width="44" height="18" rx="9" fill="#f3f4f6"/>
  <text x="802" y="989" text-anchor="middle" font-size="10" fill="#6b7280">게스트</text>
</svg>
