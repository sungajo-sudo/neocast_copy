<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Pretendard, sans-serif">
  <defs>
    <!-- 배경 그라디언트 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#daeef9"/>
      <stop offset="40%" stop-color="#f0eafc"/>
      <stop offset="100%" stop-color="#daf5ea"/>
    </linearGradient>

    <!-- 모달 그림자 -->
    <filter id="modalShadow" x="-8%" y="-4%" width="120%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur"/>
      <feOffset in="blur" dy="8" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 카드 그림자 -->
    <filter id="softShadow" x="-2%" y="-2%" width="108%" height="114%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dy="1" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.09"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════
       배경 (이전 화면 - 09-host-replay-detail 간략화)
  ═══════════════════════════════════════════ -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect width="1440" height="900" fill="white" fill-opacity="0.32"/>

  <!-- GNB 상단 바 -->
  <rect width="1440" height="28" fill="white" fill-opacity="0.8"/>
  <line x1="0" y1="28" x2="1440" y2="28" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 네비게이션 바 -->
  <rect x="0" y="28" width="1440" height="32" fill="white" fill-opacity="0.7"/>
  <line x1="0" y1="60" x2="1440" y2="60" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 왼쪽 패널 (전체 페이지) - 간략 -->
  <rect x="150" y="80" width="784" height="810" rx="24" fill="white" fill-opacity="0.55"/>
  <!-- 카드 그리드 (간략 표현) -->
  <rect x="170" y="120" width="240" height="360" rx="12" fill="white" fill-opacity="0.7"/>
  <rect x="422" y="120" width="240" height="360" rx="12" fill="white" fill-opacity="0.7"/>
  <rect x="674" y="120" width="240" height="360" rx="12" fill="white" fill-opacity="0.7"/>
  <rect x="170" y="492" width="240" height="360" rx="12" fill="white" fill-opacity="0.7"/>
  <rect x="422" y="492" width="240" height="360" rx="12" fill="white" fill-opacity="0.7"/>

  <!-- 오른쪽 패널 -->
  <rect x="954" y="80" width="336" height="500" rx="24" fill="white" fill-opacity="0.55"/>

  <!-- 푸터 -->
  <rect x="0" y="870" width="1440" height="30" fill="white" fill-opacity="0.6"/>

  <!-- ═══════════════════════════════════════════
       반투명 딤 오버레이
  ═══════════════════════════════════════════ -->
  <rect width="1440" height="900" fill="#0f172a" fill-opacity="0.48"/>


  <!-- ═══════════════════════════════════════════
       모달 컨테이너 (560 x 868, 화면 중앙)
  ═══════════════════════════════════════════ -->
  <rect x="440" y="16" width="560" height="868" rx="24" fill="white" filter="url(#modalShadow)"/>

  <!-- ── 헤더 ─────────────────────────── -->
  <text x="472" y="54" font-size="18" font-weight="700" fill="#1e293b">페이지 2 리플레이</text>

  <!-- 닫기(X) 버튼 -->
  <circle cx="968" cy="46" r="16" fill="#f1f5f9"/>
  <line x1="962" y1="40" x2="974" y2="52" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="974" y1="40" x2="962" y2="52" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- 구분선 -->
  <line x1="472" y1="68" x2="968" y2="68" stroke="#f1f5f9" stroke-width="1"/>


  <!-- ═══════════════════════════════════════════
       A4 세로 미리보기 영역
       410 x 580 = 1 : 1.414 (정확한 A4 비율)
       x = 440 + (560-410)/2 = 515
  ═══════════════════════════════════════════ -->
  <rect x="515" y="80" width="410" height="580" rx="14" fill="#eef4ff" stroke="#dbeafe" stroke-width="1"/>




  <!-- ═══════════════════════════════════════════
       프로그레스 바
  ═══════════════════════════════════════════ -->
  <!-- 트랙 -->
  <rect x="472" y="676" width="496" height="4" rx="2" fill="#e2e8f0"/>
  <!-- 진행률 -->
  <rect x="472" y="676" width="2" height="4" rx="2" fill="#3b82f6"/>
  <!-- 노브 -->
  <circle cx="474" cy="678" r="7" fill="#3b82f6"/>

  <!-- 시간 표시 -->
  <text x="472" y="702" font-size="11" fill="#94a3b8">00:00</text>
  <text x="968" y="702" font-size="11" fill="#94a3b8" text-anchor="end">00:32</text>


  <!-- ═══════════════════════════════════════════
       재생 컨트롤 (통합)
       배속 | 10s 되감기 | 재생 | 10s 앞으로
  ═══════════════════════════════════════════ -->

  <!-- 배속 (1x) -->
  <g transform="translate(580, 755)">
    <path d="M-7 -5 A9 9 0 1 1 -3 7" fill="none" stroke="#374151" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M-8 -1 L-7 -5 L-3 -4" fill="none" stroke="#374151" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="12" y="5" font-size="15" font-weight="600" fill="#374151">1x</text>
  </g>

  <!-- 10초 되감기 -->
  <g transform="translate(650, 755)">
    <path d="M 7 -11 A 12 12 0 1 0 -7 -11" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 4 -8 L 7 -11 L 7 -7" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="5" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">10</text>
  </g>

  <!-- 재생 버튼 (메인) -->
  <g transform="translate(720, 755)">
    <polygon points="-12,-16 -12,16 16,0" fill="#1e293b"/>
  </g>

  <!-- 10초 앞으로 -->
  <g transform="translate(790, 755)">
    <path d="M -7 -11 A 12 12 0 1 1 7 -11" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M -4 -8 L -7 -11 L -7 -7" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="5" font-size="10" font-weight="700" fill="#374151" text-anchor="middle">10</text>
  </g>


  <!-- ═══════════════════════════════════════════
       닫기 버튼
  ═══════════════════════════════════════════ -->
  <rect x="472" y="834" width="496" height="44" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="861" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">닫기</text>

</svg>
