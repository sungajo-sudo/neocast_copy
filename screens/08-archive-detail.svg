  ══════════════════════════════════════ -->

  <!-- ─ 카드 1: 김선생 (호스트, "나" badge, 파란 border) ─ -->
  <rect x="290" y="318" width="276" height="228" rx="16" fill="white" fill-opacity="0.85" filter="url(#cardShadow)"/>
  <!-- 파란 border (border-2 border-blue-500) -->
  <rect x="289" y="317" width="278" height="230" rx="17" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <!-- "나" 배지 -->
  <rect x="302" y="328" width="22" height="16" rx="8" fill="#3b82f6"/>
  <text x="313" y="339" font-size="9" fill="white" text-anchor="middle" font-weight="600">나</text>
  <!-- 빈 캔버스 영역 -->
  <rect x="292" y="318" width="272" height="198" rx="14" fill="white"/>
  <!-- 하단 이름 영역 -->
  <rect x="290" y="516" width="276" height="30" rx="0" fill="white" fill-opacity="0.85"/>
  <rect x="290" y="516" width="276" height="30" rx="0" fill="none"/>
  <!-- 둥근 하단 처리 (마스크 대신 직접 그리기) -->
  <rect x="290" y="532" width="276" height="16" rx="0" fill="white" fill-opacity="0.85"/>
  <rect x="290" y="538" width="276" height="8" rx="0" fill="white" fill-opacity="0.85"/>
  <path d="M290,532 L290,546 Q290,546 306,546 L550,546 Q566,546 566,546 L566,532 Z" fill="white" fill-opacity="0.85"/>
  <text x="304" y="533" font-size="12" font-weight="500" fill="#1e293b">김선생</text>
  <!-- 호스트 배지 -->
  <rect x="516" y="521" width="38" height="18" rx="9" fill="#dbeafe"/>
  <text x="535" y="533" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="500">호스트</text>

  <!-- ─ 카드 2: 박민준 (게스트) ─ -->
  <rect x="582" y="318" width="276" height="228" rx="16" fill="white" fill-opacity="0.85" filter="url(#cardShadow)"/>
  <rect x="581" y="317" width="278" height="230" rx="17" fill="none" stroke="white" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="584" y="318" width="272" height="198" rx="14" fill="white"/>
  <text x="596" y="533" font-size="12" font-weight="500" fill="#1e293b">박민준</text>
  <rect x="808" y="521" width="38" height="18" rx="9" fill="#f3f4f6"/>
  <text x="827" y="533" font-size="10" fill="#6b7280" text-anchor="middle">게스트</text>

  <!-- ─ 카드 3: 이서연 (게스트) ─ -->
  <rect x="874" y="318" width="276" height="228" rx="16" fill="white" fill-opacity="0.85" filter="url(#cardShadow)"/>
  <rect x="873" y="317" width="278" height="230" rx="17" fill="none" stroke="white" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="876" y="318" width="272" height="198" rx="14" fill="white"/>
  <text x="888" y="533" font-size="12" font-weight="500" fill="#1e293b">이서연</text>
  <rect x="1100" y="521" width="38" height="18" rx="9" fill="#f3f4f6"/>
  <text x="1119" y="533" font-size="10" fill="#6b7280" text-anchor="middle">게스트</text>

  <!-- ══════════════════════════════════════
       카드 Row 2 (y=558, canvas h=198, name h=30)
  ══════════════════════════════════════ -->

  <!-- ─ 카드 4: 최도윤 (게스트) ─ -->
  <rect x="290" y="558" width="276" height="228" rx="16" fill="white" fill-opacity="0.85" filter="url(#cardShadow)"/>
  <rect x="289" y="557" width="278" height="230" rx="17" fill="none" stroke="white" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="292" y="558" width="272" height="198" rx="14" fill="white"/>
  <text x="304" y="773" font-size="12" font-weight="500" fill="#1e293b">최도윤</text>
  <rect x="516" y="761" width="38" height="18" rx="9" fill="#f3f4f6"/>
  <text x="535" y="773" font-size="10" fill="#6b7280" text-anchor="middle">게스트</text>

  <!-- ─ 카드 5: 정하은 (게스트) ─ -->
  <rect x="582" y="558" width="276" height="228" rx="16" fill="white" fill-opacity="0.85" filter="url(#cardShadow)"/>
  <rect x="581" y="557" width="278" height="230" rx="17" fill="none" stroke="white" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="584" y="558" width="272" height="198" rx="14" fill="white"/>
  <text x="596" y="773" font-size="12" font-weight="500" fill="#1e293b">정하은</text>
  <rect x="808" y="761" width="38" height="18" rx="9" fill="#f3f4f6"/>
  <text x="827" y="773" font-size="10" fill="#6b7280" text-anchor="middle">게스트</text>

  <!-- ─ 카드 6: 강지우 (게스트) ─ -->
  <rect x="874" y="558" width="276" height="228" rx="16" fill="white" fill-opacity="0.85" filter="url(#cardShadow)"/>
  <rect x="873" y="557" width="278" height="230" rx="17" fill="none" stroke="white" stroke-opacity="0.65" stroke-width="1"/>
  <rect x="876" y="558" width="272" height="198" rx="14" fill="white"/>
  <text x="888" y="773" font-size="12" font-weight="500" fill="#1e293b">강지우</text>
  <rect x="1100" y="761" width="38" height="18" rx="9" fill="#f3f4f6"/>
  <text x="1119" y="773" font-size="10" fill="#6b7280" text-anchor="middle">게스트</text>

  <!-- ══════════════════════════════════════
