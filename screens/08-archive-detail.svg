  <text x="314" y="270" font-size="11" fill="#374151">고등_국어_현대시_분석_워크시트.pdf · 2P · 2026/03/07 · SOBP: 5.255.0.250</text>
  <text x="914" y="270" font-size="9" fill="#94a3b8">▼</text>

