<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Pretendard, sans-serif">
  <defs>
    <!-- 수채화 배경 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f0fc"/>
      <stop offset="45%" stop-color="#f5eefe"/>
      <stop offset="100%" stop-color="#e8f8f0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="10%" cy="18%" r="38%">
      <stop offset="0%" stop-color="#bfdbfe" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="88%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="75%" cy="78%" r="40%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="22%" cy="72%" r="35%">
      <stop offset="0%" stop-color="#ddd6fe" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ddd6fe" stop-opacity="0"/>
    </radialGradient>

    <!-- 로고 그라디언트 -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 버튼 그라디언트 -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- 필터 -->
    <filter id="cardShadow" x="-4%" y="-4%" width="112%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.13"/>
    </filter>
    <filter id="softShadow" x="-2%" y="-2%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- ── 배경 ── -->
  <rect width="1440" height="900" fill="url(#bgGrad)"/>
  <rect width="1440" height="900" fill="url(#blob1)"/>
  <rect width="1440" height="900" fill="url(#blob2)"/>
  <rect width="1440" height="900" fill="url(#blob3)"/>
  <rect width="1440" height="900" fill="url(#blob4)"/>
  <rect width="1440" height="900" fill="white" fill-opacity="0.35"/>

  <!-- ══════════════════════════════════════
       GNB 상단 바 (h=28)
  ══════════════════════════════════════ -->
  <rect width="1440" height="28" fill="white" fill-opacity="0.95"/>
  <line x1="0" y1="28" x2="1440" y2="28" stroke="#e5e7eb" stroke-width="1"/>
  <!-- 로고 -->
  <text x="18" y="18" font-size="13" font-weight="800" fill="url(#logoGrad)" letter-spacing="-0.3">Neo</text>
  <text x="43" y="18" font-size="13" font-weight="800" fill="#1e293b" letter-spacing="-0.3">CAST</text>
  <!-- 우측: 언어 선택 + 유저 -->
  <rect x="1120" y="5" width="88" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1130" y="17" font-size="10" fill="#374151">🇰🇷 한국어</text>
  <text x="1202" y="17" font-size="8" fill="#9ca3af">▾</text>
  <rect x="1216" y="5" width="110" height="18" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="1228" cy="14" r="5" fill="url(#btnGrad)"/>
  <text x="1238" y="17" font-size="10" fill="#374151"> 선생님 (Mock)</text>
  <text x="1320" y="17" font-size="8" fill="#9ca3af">▾</text>

  <!-- ══════════════════════════════════════
       두 번째 헤더 바 (h=32, y=28)
  ══════════════════════════════════════ -->
  <rect x="0" y="28" width="1440" height="32" fill="white" fill-opacity="0.90"/>
  <line x1="0" y1="60" x2="1440" y2="60" stroke="#e5e7eb" stroke-width="1"/>
  <text x="18" y="50" font-size="13" font-weight="700" fill="#1e293b">NeoCAST</text>

  <!-- ══════════════════════════════════════
       본문 콘텐츠 (y=60~870)
       중앙 정렬: x=290, width=860
  ══════════════════════════════════════ -->

  <!-- ← 뒤로가기 -->
  <text x="290" y="92" font-size="12" fill="#94a3b8">← 뒤로가기</text>

  <!-- 세션 제목 -->
  <text x="290" y="120" font-size="22" font-weight="700" fill="#0f172a">고등 국어 - 현대시 분석</text>

  <!-- 날짜 + 배지 -->
  <text x="290" y="140" font-size="12" fill="#64748b">2026-03-07 14:30</text>
  <rect x="382" y="128" width="32" height="16" rx="8" fill="#f1f5f9"/>
  <text x="398" y="139" font-size="10" fill="#94a3b8" text-anchor="middle">종료</text>

  <!-- ══════════════════════════════════════
       요약 카드 3개 (y=156, h=72)
  ══════════════════════════════════════ -->
  <!-- 카드 1: 참가자 수 -->
  <rect x="290" y="156" width="276" height="72" rx="16" fill="white" fill-opacity="0.75" filter="url(#cardShadow)"/>
  <rect x="290" y="156" width="276" height="72" rx="16" fill="none" stroke="white" stroke-opacity="0.70" stroke-width="1"/>
  <text x="310" y="178" font-size="11" fill="#94a3b8">참가자 수</text>
  <text x="310" y="208" font-size="22" font-weight="700" fill="#3b82f6">8명</text>

  <!-- 카드 2: 진행 시간 -->
  <rect x="582" y="156" width="276" height="72" rx="16" fill="white" fill-opacity="0.75" filter="url(#cardShadow)"/>
  <rect x="582" y="156" width="276" height="72" rx="16" fill="none" stroke="white" stroke-opacity="0.70" stroke-width="1"/>
  <text x="602" y="178" font-size="11" fill="#94a3b8">진행 시간</text>
  <text x="602" y="208" font-size="22" font-weight="700" fill="#8b5cf6">45분</text>

  <!-- 카드 3: 첨삭 횟수 -->
  <rect x="874" y="156" width="276" height="72" rx="16" fill="white" fill-opacity="0.75" filter="url(#cardShadow)"/>
  <rect x="874" y="156" width="276" height="72" rx="16" fill="none" stroke="white" stroke-opacity="0.70" stroke-width="1"/>
  <text x="894" y="178" font-size="11" fill="#94a3b8">첨삭 횟수</text>
  <text x="894" y="205" font-size="22" font-weight="700" fill="#f97316">12회</text>
  <text x="894" y="220" font-size="10" fill="#9ca3af">호스트 첨삭 사용 횟수</text>

  <!-- ══════════════════════════════════════
       PDF 선택 바 (y=244, h=44)
  ══════════════════════════════════════ -->
  <rect x="290" y="244" width="860" height="44" rx="14" fill="white" fill-opacity="0.75" filter="url(#cardShadow)"/>
  <rect x="290" y="244" width="860" height="44" rx="14" fill="none" stroke="white" stroke-opacity="0.70" stroke-width="1"/>

